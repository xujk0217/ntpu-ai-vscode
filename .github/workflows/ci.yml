name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    name: ${{ matrix.platform.target }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        platform:
          - {runner: windows-2022, target: win32-x64, browser: edge}
          - {runner: macos-15, target: darwin-arm64, browser: chrome}
          - {runner: macos-15-intel, target: darwin-x64, browser: chrome}
          - {runner: ubuntu-22.04, target: linux-x64, browser: chromium}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=optional
      - name: Install OCR and Linux isolation dependencies
        if: runner.os == 'Linux' && matrix.node == '22'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep tesseract-ocr poppler-utils
      - name: Install macOS OCR dependencies
        if: runner.os == 'macOS' && matrix.node == '22'
        run: brew install tesseract poppler ripgrep
      - run: npm test
      - name: Bundled graphics and offline OCR (no native OCR or network required)
        run: npm run capabilities:fixture
      - name: Native OS sandbox acceptance (Windows pending manual validation)
        if: runner.os != 'Windows' && matrix.node == '22'
        run: npm run sandbox:fixture
      - name: Real local OCR acceptance
        if: runner.os != 'Windows' && matrix.node == '22'
        run: npm run ocr:fixture
      - run: npm run build
      - name: Install Chromium for local website fixture (Linux)
        if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium
      - name: Exercise login window and background handoff on Linux (no school account)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run browser:fixture
        env:
          NTPU_FIXTURE_BROWSER: ${{ matrix.platform.browser }}
      - name: Exercise login window and background handoff (no school account)
        if: runner.os != 'Linux'
        run: npm run browser:fixture
        env:
          NTPU_FIXTURE_BROWSER: ${{ matrix.platform.browser }}
      - name: Controlled work browser acceptance (synthetic localhost only)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run computer:fixture
        env:
          NTPU_FIXTURE_BROWSER: ${{ matrix.platform.browser }}
      - name: Controlled work browser acceptance (synthetic localhost only)
        if: runner.os != 'Linux'
        run: npm run computer:fixture
        env:
          NTPU_FIXTURE_BROWSER: ${{ matrix.platform.browser }}
      - name: Package portable local MCP plugin
        if: runner.os == 'Linux' && matrix.node == '22'
        run: python3 scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.node == '22'
        with:
          name: ntpu-ai-plugin
          path: '*.plugin.zip'
          if-no-files-found: error
      # sandbox-runtime declares Node >=22.12; Node 20 still runs tests/build/fixtures,
      # while the distributable VSIX is packaged once per OS on the supported Node 22 lane.
      - run: npm run package -- --target ${{ matrix.platform.target }}
        if: matrix.node == '22'
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: ntpu-ai-agent-${{ matrix.platform.target }}
          path: '*.vsix'
          if-no-files-found: error
